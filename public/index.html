<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Processos SejaPay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: lista curta de processos da empresa, um cartão por processo. */
:root{--bg:#F3F6F6;--surface:#FFFFFF;--ink:#12302F;--muted:#5A7170;--line:#C9D6D5;--accent:#0C7476;--navy:#1C2340;--teal:#3FB4C8;
  --display:"Archivo",system-ui,sans-serif;--body:"Source Sans 3",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#0F1A1A;--surface:#162625;--ink:#E4EEED;--muted:#93AAA8;--line:#2C4442;--accent:#4FC2C0;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.bar{height:3px;width:96px;background:linear-gradient(90deg,var(--teal) 0 40%,var(--navy) 40%);margin-bottom:18px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,4vw,2.4rem);margin:0 0 6px;letter-spacing:-.01em}
p.lead{color:var(--muted);margin:0 0 28px}
.list{display:grid;gap:12px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
a.card h2{font-family:var(--display);font-size:1.1rem;margin:0 0 2px;color:var(--accent)}
a.card p{margin:0;color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"></div>
  <h1>Processos SejaPay</h1>
  <p class="lead">Fluxogramas, mensagens padrão e ferramentas da equipe.</p>
  <div class="list">
    <a class="card" href="/fluxo/"><h2>Fluxo do cliente White Label</h2><p>Da entrada do lead ao início da operação, com as mensagens padrão de cada etapa.</p></a>
    <a class="card" href="/contrato/"><h2>Contrato White Label</h2><p>Preencha os dados do parceiro, gere o PDF e envie para assinatura no Assinafy.</p></a>
  </div>
</div>
</body>
</html>
